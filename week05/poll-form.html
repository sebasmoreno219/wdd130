<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="styles/poll-form.css">
</head>

<body>
    <header>
        <main>
            <h1>WDD 130 | HTML Form - User Poll</h1>
            <form>
                <fieldset>
                    <legend>Contact Information</legend>
                    <div class="form-item column2">
                        <label for="fullname">Fullname:</label>
                        <input type="text" id="fullname" name="fullname" required>
                    </div>
                    <div class="form-item column2">
                        <label for="email">Email:</label>
                        <input type="email" id="useremail" name="useremail" required>
                    </div>
                </fieldset>

                <fieldset>
                    <legend>Questions</legend>
                    <div class="form-item column1">
                        <label for="browser">What is your favorite browser?</label>
                        <select name="browser" id="browser">
                            <option value="chrome">Google Chrome</option>
                            <option value="firefox">Mozilla Firefox</option>
                            <option value="edge">Microsoft Edge</option>
                            <option value="other">Other</option>
                        </select>
                    </div>
                    <div class="form-item column1 pet-row">
                        <label for="pet">Do you have a household pet?</label>
                        <input type="checkbox" id="pet" name="pet">
                    </div>
                    <div class="form-item places-row">
                        <label for="feedback">List the places you have lived.</label>
                        <textarea name="feedback" id="feedback" rows="4"
                          placeholder="Cochabamba, Santa Cruz, La Paz"></textarea>
                    </div>
                </fieldset>

                <button type="submit">Submit Poll</button>
            </form>
        </main>
    </header>
    <footer>
        <p>&copy;2026 | HTML Form - User Poll Activity | Sebastian Moreno</p>
    </footer>
</body>
